<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGemini PT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans Thai", Arial, sans-serif;
            background: #0b0d12;
            color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: #11141b;
            border-right: 1px solid #252a35;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            padding: 22px 20px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid #252a35;
        }

        .logo span {
            color: #ff4d5a;
        }

        .new-chat {
            margin: 16px;
            padding: 12px 15px;
            border: 1px solid #343a48;
            border-radius: 10px;
            background: #1a1e27;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: #252a35;
            border-color: #4a5160;
        }

        .chat-title {
            padding: 0 16px 10px;
            color: #8e96a5;
            font-size: 12px;
            text-transform: uppercase;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 15px;
        }

        .chat-item {
            padding: 11px 12px;
            border-radius: 9px;
            margin-bottom: 4px;
            color: #c9ced8;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }

        .chat-item:hover {
            background: #1c2029;
        }

        .chat-item.active {
            background: #252a35;
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #0b0d12;
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid #252a35;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }

        .mobile-menu {
            display: none;
            border: none;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #8e96a5;
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #43d17a;
            border-radius: 50%;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 20px;
            scroll-behavior: smooth;
        }

        .message-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .welcome {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-box {
            max-width: 600px;
        }

        .welcome-icon {
            font-size: 55px;
            margin-bottom: 18px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #969eac;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 25px;
            gap: 12px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .user .avatar {
            background: #343a48;
        }

        .assistant .avatar {
            background: #ff4d5a;
        }

        .message-body {
            min-width: 0;
            flex: 1;
        }

        .message-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cfd4dd;
        }

        .message-text {
            color: #e5e7eb;
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .message-text {
            color: #f5f5f5;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 5px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: #8d95a3;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            padding: 12px 20px 20px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: #171a22;
            border: 1px solid #303642;
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            transition: 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #4a5160;
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            padding: 9px 10px;
            max-height: 150px;
            min-height: 42px;
        }

        #messageInput::placeholder {
            color: #6f7785;
        }

        .send-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #ff4d5a;
            color: white;
            cursor: pointer;
            font-size: 17px;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .send-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            max-width: 850px;
            margin: 8px auto 0;
            text-align: center;
            color: #606876;
            font-size: 11px;
        }

        /* =========================
           SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #303642;
            border-radius: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                position: fixed;
                z-index: 100;
                left: -280px;
                top: 0;
                bottom: 0;
                transition: left 0.25s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 14px;
            }

            .messages {
                padding: 20px 14px 10px;
            }

            .input-area {
                padding: 8px 10px 12px;
            }

            .hint {
                display: none;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .welcome-icon {
                font-size: 45px;
            }

            .message {
                margin-bottom: 20px;
            }

            .message-text {
                font-size: 14px;
            }

            .status {
                display: none;
            }
        }

        /* Overlay มือถือ */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 90;
        }

        .overlay.show {
            display: block;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            🤖 Chat<span>Gemini PT</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ &nbsp;แชตใหม่
        </button>

        <div class="chat-title">
            ประวัติการสนทนา
        </div>

        <div class="chat-list" id="chatList">
            <!-- รายการแชตจะถูกใส่ตรงนี้ -->
        </div>

    </aside>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <button class="mobile-menu" onclick="openSidebar()">
                ☰
            </button>

            <div class="topbar-title">
                ChatGemini PT
            </div>

            <div class="status">
                <span class="status-dot"></span>
                พร้อมใช้งาน
            </div>

        </header>

        <!-- MESSAGES -->
        <section class="messages" id="messages">

            <div class="message-container" id="messageContainer">

                <div class="welcome" id="welcome">

                    <div class="welcome-box">

                        <div class="welcome-icon">
                            🤖
                        </div>

                        <h1>
                            สวัสดี 👋
                        </h1>

                        <p>
                            ฉันคือ <b>ChatGemini PT</b><br>
                            ผู้ช่วย AI ที่พร้อมตอบคำถาม พูดคุย
                            และช่วยคุณในเรื่องต่าง ๆ
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <!-- INPUT -->
        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    placeholder="พิมพ์ข้อความ..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="sendMessage()"
                    title="ส่งข้อความ"
                >
                    ➤
                </button>

            </div>

            <div class="hint">
                Enter เพื่อส่ง • Shift + Enter เพื่อขึ้นบรรทัดใหม่
            </div>

        </div>

    </main>

</div>

<script>

    let currentChatId = null;
    let sending = false;

    /* =========================
       LOAD CHATS
    ========================= */

    async function loadChats() {

        try {

            const response = await fetch("/chats");
            const chats = await response.json();

            const chatList = document.getElementById("chatList");

            chatList.innerHTML = "";

            chats.forEach(chat => {

                const item = document.createElement("div");

                item.className = "chat-item";

                if (chat.id === currentChatId) {
                    item.classList.add("active");
                }

                item.textContent = chat.title || "แชตใหม่";

                item.onclick = () => {
                    loadChat(chat.id);
                    closeSidebar();
                };

                chatList.appendChild(item);

            });

        } catch (error) {

            console.error("โหลดรายการแชตไม่ได้:", error);

        }
    }


    /* =========================
       LOAD CHAT
    ========================= */

    async function loadChat(chatId) {

        try {

            const response = await fetch(`/chat/${chatId}`);
            const chat = await response.json();

            currentChatId = chatId;

            const container =
                document.getElementById("messageContainer");

            container.innerHTML = "";

            if (!chat.messages || chat.messages.length === 0) {

                showWelcome();

            } else {

                chat.messages.forEach(message => {

                    addMessage(
                        message.role,
                        message.content,
                        false
                    );

                });

            }

            await loadChats();

            scrollToBottom();

        } catch (error) {

            console.error("โหลดแชตไม่ได้:", error);

        }
    }


    /* =========================
       NEW CHAT
    ========================= */

    async function newChat() {

        try {

            const response = await fetch("/new-chat", {
                method: "POST"
            });

            const chat = await response.json();

            currentChatId = chat.id;

            const container =
                document.getElementById("messageContainer");

            container.innerHTML = "";

            showWelcome();

            await loadChats();

            closeSidebar();

            document.getElementById("messageInput").focus();

        } catch (error) {

            console.error("สร้างแชตไม่ได้:", error);

        }
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

        if (sending) return;

        const input =
            document.getElementById("messageInput");

        const message =
            input.value.trim();

        if (!message) return;

        sending = true;

        const button =
            document.getElementById("sendButton");

        button.disabled = true;

        hideWelcome();

        addMessage("user", message);

        input.value = "";

        autoResize(input);

        showTyping();

        scrollToBottom();

        try {

            /*
             * ถ้ายังไม่มีแชต ให้สร้างก่อน
             */

            if (!currentChatId) {

                const newChatResponse =
                    await fetch("/new-chat", {
                        method: "POST"
                    });

                const newChatData =
                    await newChatResponse.json();

                currentChatId = newChatData.id;

            }

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        chat_id: currentChatId,
                        message: message
                    })

                });

            if (!response.ok) {
                throw new Error("เซิร์ฟเวอร์ตอบกลับผิดพลาด");
            }

            const data = await response.json();

            hideTyping();

            addMessage(
                "assistant",
                data.response || data.message || "ไม่พบคำตอบ"
            );

            await loadChats();

        } catch (error) {

            console.error(error);

            hideTyping();

            addMessage(
                "assistant",
                "ขออภัย เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์"
            );

        }

        sending = false;

        button.disabled = false;

        input.focus();

        scrollToBottom();
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(role, text, scroll = true) {

        const container =
            document.getElementById("messageContainer");

        const message =
            document.createElement("div");

        message.className =
            `message ${role}`;

        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            role === "user" ? "👤" : "🤖";

        const body =
            document.createElement("div");

        body.className = "message-body";

        const name =
            document.createElement("div");

        name.className = "message-name";

        name.textContent =
            role === "user" ? "คุณ" : "ChatGemini PT";

        const content =
            document.createElement("div");

        content.className = "message-text";

        /*
         * ใช้ textContent เพื่อป้องกัน HTML แปลก ๆ
         */
        content.textContent = text;

        body.appendChild(name);
        body.appendChild(content);

        message.appendChild(avatar);
        message.appendChild(body);

        container.appendChild(message);

        if (scroll) {
            scrollToBottom();
        }
    }


    /* =========================
       WELCOME
    ========================= */

    function showWelcome() {

        const container =
            document.getElementById("messageContainer");

        const welcome =
            document.createElement("div");

        welcome.className = "welcome";

        welcome.id = "welcome";

        welcome.innerHTML = `
            <div class="welcome-box">
                <div class="welcome-icon">🤖</div>
                <h1>สวัสดี 👋</h1>
                <p>
                    ฉันคือ <b>ChatGemini PT</b><br>
                    ผู้ช่วย AI ที่พร้อมตอบคำถาม พูดคุย
                    และช่วยคุณในเรื่องต่าง ๆ
                </p>
            </div>
        `;

        container.appendChild(welcome);
    }


    function hideWelcome() {

        const welcome =
            document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }
    }


    /* =========================
       TYPING
    ========================= */

    function showTyping() {

        hideTyping();

        const container =
            document.getElementById("messageContainer");

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.id = "typingMessage";

        message.innerHTML = `
            <div class="avatar">🤖</div>

            <div class="message-body">

                <div class="message-name">
                    ChatGemini PT
                </div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;

        container.appendChild(message);

    }


    function hideTyping() {

        const typing =
            document.getElementById("typingMessage");

        if (typing) {
            typing.remove();
        }
    }


    /* =========================
       KEYBOARD
    ========================= */

    function handleKeyDown(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }


    /* =========================
       AUTO RESIZE
    ========================= */

    function autoResize(element) {

        element.style.height = "auto";

        element.style.height =
            Math.min(element.scrollHeight, 150) + "px";
    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

        const messages =
            document.getElementById("messages");

        setTimeout(() => {

            messages.scrollTop =
                messages.scrollHeight;

        }, 50);
    }


    /* =========================
       MOBILE SIDEBAR
    ========================= */

    function openSidebar() {

        document
            .getElementById("sidebar")
            .classList.add("open");

        document
            .getElementById("overlay")
            .classList.add("show");
    }


    function closeSidebar() {

        document
            .getElementById("sidebar")
            .classList.remove("open");

        document
            .getElementById("overlay")
            .classList.remove("show");
    }


    /* =========================
       START
    ========================= */

    async function startApp() {

        await loadChats();

        const response =
            await fetch("/chats");

        const chats =
            await response.json();

        if (chats.length > 0) {

            await loadChat(chats[0].id);

        } else {

            await newChat();

        }

        document
            .getElementById("messageInput")
            .focus();
    }


    startApp();

</script>

</body>
</html>
